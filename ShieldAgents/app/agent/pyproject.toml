[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shield-agents"
version = "0.1.0"
description = "Shield Insurance document, coverage, chat and narration agents on AgentCore Runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro ~= 0.21.0",
    "bedrock-agentcore >= 1.18.1, < 2.0.0",
    "botocore[crt] ~= 1.43.0",
    "boto3 ~= 1.43.0",
    "python-dotenv >= 1.0.0",
    "pypdf >= 4.2.0",
    "pypdfium2 >= 4.30.0",
    "pillow >= 11.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
